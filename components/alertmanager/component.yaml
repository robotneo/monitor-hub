name: alertmanager
kind: alert-router
upstream:
  repository: https://github.com/prometheus/alertmanager
  documentation: https://prometheus.io/docs/alerting/latest/alertmanager/
support:
  level: preview
ports:
  - name: http
    port: 9093
    protocol: tcp
paths:
  config: /etc/monitor-hub/alertmanager
  data: /var/lib/monitor-hub/alertmanager
platforms: [ubuntu-22.04, ubuntu-24.04, rocky-8, rocky-9]
architectures: [amd64, arm64]
modes: [compose]
healthcheck:
  type: http
  target: http://127.0.0.1:9093/-/ready
