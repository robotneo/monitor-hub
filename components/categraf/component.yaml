name: categraf
kind: metrics-collector
upstream:
  repository: https://github.com/flashcatcloud/categraf
  documentation: https://flashcat.cloud/docs/content/flashcat-monitor/categraf/
support:
  level: preview
ports:
  - name: http
    port: 9100
    protocol: tcp
paths:
  config: /etc/monitor-hub/categraf
  data: /var/lib/monitor-hub/categraf
platforms: [ubuntu-22.04, ubuntu-24.04, rocky-8, rocky-9]
architectures: [amd64, arm64]
modes: [compose]
healthcheck:
  type: http
  target: http://127.0.0.1:9100/metrics
