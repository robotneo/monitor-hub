name: prometheus
kind: monitoring-server
upstream:
  repository: https://github.com/prometheus/prometheus
  documentation: https://prometheus.io/docs/prometheus/latest/getting_started/
support:
  level: preview
  notes: Docker Compose single-component lifecycle is implemented.
ports:
  - name: http
    port: 9090
    protocol: tcp
paths:
  config: /etc/monitor-hub/prometheus
  data: /var/lib/monitor-hub/prometheus
platforms: [ubuntu-22.04, ubuntu-24.04, rocky-8, rocky-9]
architectures: [amd64, arm64]
modes: [compose]
healthcheck:
  type: http
  target: http://127.0.0.1:9090/-/ready
