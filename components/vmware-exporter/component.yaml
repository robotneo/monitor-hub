name: vmware-exporter
kind: exporter
upstream:
  repository: https://github.com/pryorda/vmware_exporter
  documentation: https://github.com/pryorda/vmware_exporter/blob/master/README.md
support:
  level: preview
ports:
  - name: http
    port: 9272
    protocol: tcp
paths:
  config: /etc/monitor-hub/vmware-exporter
  data: /var/lib/monitor-hub/vmware-exporter
platforms: [ubuntu-22.04, ubuntu-24.04, rocky-8, rocky-9]
architectures: [amd64, arm64]
modes: [compose]
healthcheck:
  type: http
  target: http://127.0.0.1:9272/healthz
