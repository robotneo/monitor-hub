services:
  mysql:
    image: ${MYSQL_IMAGE:?set MYSQL_IMAGE to an exact tag or digest}
    environment:
      MYSQL_DATABASE: n9e_v6
      MYSQL_USER: n9e
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    expose: ["3306"]
    volumes:
      - ${MH_DATA_DIR}/stacks/nightingale-monitoring/mysql:/var/lib/mysql
      - ${MH_CONFIG_DIR}/stacks/nightingale-monitoring/secrets/mysql-root-password:/run/secrets/mysql_root_password:ro
      - ${MH_CONFIG_DIR}/stacks/nightingale-monitoring/secrets/mysql-password:/run/secrets/mysql_password:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=$$(cat /run/secrets/mysql_root_password)"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE to an exact tag or digest}
    command: ["redis-server", "--appendonly", "yes"]
    expose: ["6379"]
    volumes:
      - ${MH_DATA_DIR}/stacks/nightingale-monitoring/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  victoriametrics:
    image: ${VICTORIAMETRICS_IMAGE:?set VICTORIAMETRICS_IMAGE to an exact tag or digest}
    user: "1000:1000"
    command: ["-storageDataPath=/storage", "-retentionPeriod=${VICTORIAMETRICS_RETENTION:-30d}"]
    expose: ["8428"]
    volumes:
      - ${MH_DATA_DIR}/stacks/nightingale-monitoring/victoriametrics:/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  nightingale:
    image: ${NIGHTINGALE_IMAGE:?set NIGHTINGALE_IMAGE to an exact tag or digest}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    ports:
      - "${NIGHTINGALE_PORT:-17000}:17000"
    volumes:
      - ${MH_CONFIG_DIR}/stacks/nightingale-monitoring/nightingale/config.toml:/app/etc/config.toml:ro
      - ${MH_DATA_DIR}/stacks/nightingale-monitoring/nightingale:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:17000/api/n9e/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  categraf:
    image: ${CATEGRAF_IMAGE:?set CATEGRAF_IMAGE to an exact tag or digest}
    user: "1000:1000"
    command: ["--configs", "/etc/categraf/conf"]
    volumes:
      - ${MH_CONFIG_DIR}/stacks/nightingale-monitoring/categraf:/etc/categraf/conf:ro
      - ${MH_DATA_DIR}/stacks/nightingale-monitoring/categraf:/var/lib/categraf
    depends_on:
      nightingale:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE to an exact tag or digest}
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ${MH_CONFIG_DIR}/stacks/nightingale-monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MH_CONFIG_DIR}/stacks/nightingale-monitoring/secrets/grafana-admin-password:/run/secrets/grafana_admin_password:ro
      - ${MH_DATA_DIR}/stacks/nightingale-monitoring/grafana:/var/lib/grafana
    depends_on:
      victoriametrics:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
